<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Mayorista</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { 
            margin: 0 0 10px 0; 
            color: #4ade80; 
            font-size: 32px;
            font-weight: bold;
        }
        header p {
            color: #aaaaaa;
            margin: 0 0 20px 0;
        }
        
        /* Rediseño del carrito para que no compita tanto con el centro */
        .seccion-carrito {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto 30px auto;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .item-carrito {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            border-bottom: 1px dashed #333;
            padding-bottom: 4px;
        }
        .total-carrito {
            font-size: 20px;
            font-weight: bold;
            color: #4ade80;
            text-align: right;
            margin-top: 15px;
        }

        /* 🔍 Contenedor del Buscador (Estilo barra limpia superior) */
        .contenedor-buscador {
            margin: 0 auto 25px auto; 
            max-width: 600px; 
            padding: 0 15px;
        }
        .contenedor-buscador input {
            width: 100%; 
            padding: 14px 25px; 
            border-radius: 30px; 
            border: 1px solid #333; 
            background-color: #1e1e1e; 
            color: white; 
            font-size: 16px; 
            outline: none; 
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .contenedor-buscador input:focus {
            border-color: #4ade80; /* Brilla verde al hacer clic */
        }
        
        /* Grilla de productos */
        .grilla-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 10px 0;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tarjeta-producto {
            background-color: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s;
        }
        .tarjeta-producto:hover {
            transform: translateY(-3px);
            border-color: #4ade80;
        }
        .tarjeta-producto img {
            max-width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        .tarjeta-producto h3 { 
            font-size: 15px; 
            margin: 12px 0 6px 0; 
            font-weight: 600;
            height: 42px;
            overflow: hidden;
        }
        .tarjeta-producto p { 
            font-size: 12px; 
            color: #8888aa; 
            margin: 0 0 12px 0; 
            height: 36px;
            overflow: hidden;
        }
        .precio { 
            font-size: 18px; 
            font-weight: bold; 
            color: #4ade80; 
            margin: 8px 0; 
        }
        
        /* Botones */
        .btn-agregar {
            background-color: #2a2a2a;
            color: #4ade80;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, color 0.2s;
        }
        .btn-agregar:hover { 
            background-color: #4ade80; 
            color: #121212; 
        }
        
        .btn-comprar-wa {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: background-color 0.2s;
        }
        .btn-comprar-wa:hover { background-color: #20ba5a; }
    </style>
</head>
<body>

    <header>
        <h1>Mi Tienda Mayorista</h1>
        <p>Armá tu pedido y envialo directamente por WhatsApp</p>
        
        <!-- Vista del Carrito de Compras -->
        <div class="seccion-carrito">
            <h2 style="font-size: 16px; margin-top: 0; color: #4ade80; text-align: center;">🛒 Tu Carrito de Compras</h2>
            <div id="lista-carrito">
                <p style="color: #aaa; font-size: 13px; text-align: center;">El carrito está vacío.</p>
            </div>
            <div class="total-carrito">Total: $<span id="monto-total">0</span></div>
            <button class="btn-comprar-wa" id="btn-finalizar" style="display: none;">Enviar Pedido por WhatsApp</button>
        </div>

        <!-- 🔍 Barra de búsqueda alineada al centro superior -->
        <div class="contenedor-buscador">
            <input type="text" id="buscador-productos" placeholder="🔍 Buscar producto en el catálogo...">
        </div>
    </header>

    <!-- Grilla de exhibición -->
    <main class="grilla-productos" id="contenedor-productos"></main>

    <!-- Ventana flotante oculta para ampliar las fotos al hacer clic -->
    <div id="mi-modal-imagen" style="display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; cursor: pointer;">
        <span style="position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer;">&times;</span>
        <img id="imagen-ampliada" style="max-width: 90%; max-height: 85%; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); cursor: default;" src="" alt="Vista ampliada">
    </div>

    <script src="script.js"></script>
</body>
</html>
