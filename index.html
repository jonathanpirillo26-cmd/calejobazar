<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Mayorista</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff00;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #ffffff;
            position: relative;
        }
        h1 { margin: 0; color: #4ade80; }
        
        /* Contenedor del Carrito en el Encabezado */
        .seccion-carrito {
            background-color: #131212;
            border: 1px solid #4ade80;
            border-radius: 8px;
            padding: 15px;
            max-width: 400px;
            margin: 20px auto 0 auto;
            text-align: left;
        }
        .item-carrito {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            border-bottom: 1px dashed #333;
            padding-bottom: 4px;
        }
        .total-carrito {
            font-size: 18px;
            font-weight: bold;
            color: #4ade80;
            text-align: right;
            margin-top: 10px;
        }

        /* Grilla de productos */
        .grilla-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 30px 0;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tarjeta-producto {
            background-color: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .tarjeta-producto img {
            max-width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        .tarjeta-producto h3 { font-size: 16px; margin: 12px 0 6px 0; }
        .tarjeta-producto p { font-size: 12px; color: #aaaaaa; margin: 0 0 12px 0; }
        .precio { font-size: 20px; font-weight: bold; color: #4ade80; margin: 10px 0; }
        
        /* Botones */
        .btn-agregar {
            background-color: #4ade80;
            color: #121212;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-agregar:hover { background-color: #3bc273; }
        
        .btn-comprar-wa {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 16px;
        }
        .btn-comprar-wa:hover { background-color: #20ba5a; }
    </style>
</head>
<body>

    <header>
        <h1>Mi Tienda Mayorista</h1>
        <p>Armá tu pedido y envialo directamente por WhatsApp</p>
        
        <!-- Vista del Carrito de Compras -->
        <div class="seccion-carrito">
            <h2 style="font-size: 16px; margin-top: 0; color: #4ade80;">🛒 Tu Carrito</h2>
            <div id="lista-carrito">
                <p style="color: #aaa; font-size: 13px;">El carrito está vacío.</p>
            </div>
            <div class="total-carrito">Total: $<span id="monto-total">0</span></div>
            
            <!-- CORREGIDO: Lógica integrada directamente para asegurar el funcionamiento -->
            <button class="btn-comprar-wa" id="btn-finalizar" style="display: none;" onclick="(() => {
                if (!carrito || carrito.length === 0) { return; }
                var nroTelefono = '5491127433172';
                var mensaje = '🛒 *NUEVO PEDIDO MAYORISTA*\n\n';
                var totalPedido = 0;
                carrito.forEach(function(item) {
                    var subtotal = item.precio * item.cantidad;
                    totalPedido += subtotal;
                    mensaje += '▪️ ' + item.nombre + ' x' + item.cantidad + ' - $' + subtotal.toLocaleString('es-AR') + '\n';
                });
                mensaje += '\n💰 *Total Estimado: $' + totalPedido.toLocaleString('es-AR') + '*';
                window.open('https://whatsapp.com' + nroTelefono + '&text=' + encodeURIComponent(mensaje), '_blank');
            })()">Pedir Todo por WhatsApp</button>
        </div>
    </header>

    <main class="grilla-productos" id="contenedor-productos"></main>

    <script src="script.js"></script>
</body>
</html>
